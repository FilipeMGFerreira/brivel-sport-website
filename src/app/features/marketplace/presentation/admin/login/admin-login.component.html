<div class="min-h-[calc(100vh-200px)] py-10 sm:py-16 md:py-20 px-4 sm:px-6 bg-bg-dark">
  <section class="text-center mb-8 sm:mb-12 max-w-[800px] mx-auto">
    <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-accent mb-3 uppercase tracking-wider px-2">Admin – Peças</h1>
    <p class="text-sm sm:text-base text-text-gray m-0 px-2">Inicie sessão para gerir anúncios.</p>
  </section>

  <div class="max-w-[800px] mx-auto">
    <div class="bg-bg-darker rounded-2xl sm:rounded-3xl p-4 sm:p-6 md:p-8 border border-border shadow-2xl">
      <h2 class="text-lg sm:text-xl font-bold text-white mb-4 sm:mb-6 uppercase tracking-wide">Iniciar sessão</h2>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-semibold text-white mb-2 uppercase tracking-wide">Email *</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="w-full px-4 py-3 bg-bg-dark border border-border rounded-xl text-white placeholder-text-dark focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition-all duration-300"
            placeholder="admin@exemplo.com"
            [class.border-red-500]="f['email'].invalid && f['email'].touched"
          />
          @if (f['email'].invalid && f['email'].touched) {
            <p class="mt-1 text-sm text-red-500">Email inválido</p>
          }
        </div>

        <div>
          <label for="password" class="block text-sm font-semibold text-white mb-2 uppercase tracking-wide">Palavra-passe *</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            class="w-full px-4 py-3 bg-bg-dark border border-border rounded-xl text-white placeholder-text-dark focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition-all duration-300"
            placeholder="••••••••"
            [class.border-red-500]="f['password'].invalid && f['password'].touched"
          />
          @if (f['password'].invalid && f['password'].touched) {
            <p class="mt-1 text-sm text-red-500">Palavra-passe obrigatória</p>
          }
        </div>

        @if (error) {
          <p class="text-sm text-red-500">{{ error }}</p>
        }

        <button
          type="submit"
          [disabled]="isSubmitting"
          class="w-full inline-flex justify-center items-center px-8 py-4 bg-accent text-white rounded-xl font-bold uppercase tracking-wider transition-all duration-300 hover:bg-accent-dark disabled:opacity-50 disabled:cursor-not-allowed">
          {{ isSubmitting ? 'A carregar...' : 'Entrar' }}
        </button>
      </form>
    </div>
  </div>
</div>
