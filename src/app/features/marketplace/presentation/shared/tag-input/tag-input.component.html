<div class="tag-input flex flex-wrap items-center gap-2 min-h-[42px] px-3 py-2 bg-bg-dark border border-border rounded-lg sm:rounded-xl focus-within:border-accent focus-within:ring-2 focus-within:ring-accent/20 transition-all duration-300">
  @for (ctrl of tagsArray().controls; track $index; let i = $index) {
    <span class="tag-pill inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-semibold bg-accent/20 text-accent">
      {{ ctrl.value }}
      <button
        type="button"
        (click)="removeTag(i)"
        class="p-0.5 rounded hover:bg-accent/40 focus:outline-none focus:ring-2 focus:ring-accent"
        aria-label="Remover tag">
        ×
      </button>
    </span>
  }
  <input
    type="text"
    [placeholder]="placeholder()"
    (keydown)="onKeydown($event, $any($event.target))"
    (blur)="addTagFromInput($any($event.target))"
    class="tag-input-field flex-1 min-w-[120px] py-1 px-0 bg-transparent border-0 text-white text-sm placeholder-text-dark focus:outline-none focus:ring-0"
  />
</div>
