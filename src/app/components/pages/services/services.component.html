<div class="min-h-[calc(100vh-200px)] py-20 px-6 bg-bg-dark">
  <section id="servicos" class="text-center mb-16 max-w-[800px] mx-auto">
    <h1 class="text-5xl font-bold text-accent mb-4 uppercase tracking-wider">Nossos Serviços</h1>
    <p class="text-xl text-text-gray m-0">Oferecemos soluções completas para suas necessidades em motoresport</p>
  </section>

  <section class="max-w-[1200px] mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
    @for (service of services; track service.title) {
      <div class="bg-bg-darker rounded-3xl overflow-hidden border border-border transition-all duration-300 hover:border-accent hover:-translate-y-2 shadow-xl hover:shadow-2xl">
        <div class="w-full h-[280px] overflow-hidden bg-bg-dark">
          <img [src]="service.image" [alt]="service.title" 
               class="w-full h-full object-cover transition-transform duration-500 hover:scale-110" />
        </div>
        <div class="p-8">
          <h3 class="m-0 mb-4 text-accent text-2xl font-bold uppercase tracking-wide">{{ service.title }}</h3>
          <p class="m-0 text-text-gray leading-relaxed text-base">{{ service.description }}</p>
        </div>
      </div>
    }
  </section>
</div>
