<div class="min-h-[calc(100vh-200px)] py-10 sm:py-16 md:py-20 px-4 sm:px-6 bg-bg-dark">
  <section id="servicos" class="text-center mb-8 sm:mb-12 md:mb-16 max-w-[800px] mx-auto">
    <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold text-accent mb-3 sm:mb-4 uppercase tracking-wider px-2">Nossos Serviços</h1>
    <p class="text-sm sm:text-base md:text-lg lg:text-xl text-text-gray m-0 px-2">Oferecemos soluções completas para as suas necessidades em competição.</p>
  </section>

  <section class="max-w-[1200px] mx-auto grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6 md:gap-8">
    @for (service of services; track service.title) {
      <div class="bg-bg-darker rounded-2xl sm:rounded-3xl overflow-hidden border border-border transition-all duration-300 hover:border-accent hover:-translate-y-2 shadow-xl hover:shadow-2xl">
        <div class="w-full h-[200px] sm:h-[240px] md:h-[280px] overflow-hidden bg-bg-dark">
          <img [src]="service.image" [alt]="service.title" 
               class="w-full h-full object-cover transition-transform duration-500 hover:scale-110" />
        </div>
        <div class="p-4 sm:p-6 md:p-8">
          <h3 class="m-0 mb-3 sm:mb-4 text-accent text-lg sm:text-xl md:text-2xl font-bold uppercase tracking-wide">{{ service.title }}</h3>
          <p class="m-0 text-text-gray leading-relaxed text-xs sm:text-sm md:text-base">{{ service.description }}</p>
        </div>
      </div>
    }
  </section>
</div>
