<div class="min-h-[calc(100vh-200px)] py-10 sm:py-16 md:py-20 px-4 sm:px-6 bg-bg-dark">
  <section id="campeonatos" class="text-center mb-8 sm:mb-12 md:mb-16 max-w-[800px] mx-auto">
    <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold text-accent mb-3 sm:mb-4 uppercase tracking-wider px-2">Campeonatos</h1>
    <p class="text-sm sm:text-base md:text-lg lg:text-xl text-text-gray m-0 px-2">Campeonatos para os quais trabalhamos e onde participamos.</p>
  </section>

  <section class="max-w-[1200px] mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6 md:gap-8 justify-items-center">
    @for (championship of championships; track championship.id) {
      <div class="bg-bg-darker rounded-2xl sm:rounded-3xl overflow-hidden border border-border transition-all duration-300 hover:border-accent hover:-translate-y-2 shadow-xl hover:shadow-2xl w-full max-w-sm">
        <div class="relative w-full h-[150px] sm:h-[180px] md:h-[200px] overflow-hidden bg-bg-dark flex items-center justify-center p-4">
          <img [src]="championship.image" 
               [alt]="championship.name" 
               class="max-w-[80%] max-h-[80%] w-auto h-auto object-contain transition-transform duration-500 hover:scale-110" />
          @if (championship.isPrincipal) {
            <div class="absolute top-3 right-3 bg-accent text-white text-xs font-bold uppercase tracking-wide px-3 py-1 rounded-full shadow-lg">
              Principal
            </div>
          }
        </div>
        <div class="p-4 sm:p-6 md:p-8">
          <h3 class="m-0 mb-3 sm:mb-4 text-accent text-lg sm:text-xl md:text-2xl font-bold uppercase tracking-wide">{{ championship.name }}</h3>
          <p class="m-0 mb-4 sm:mb-6 text-text-gray leading-relaxed text-xs sm:text-sm md:text-base">{{ championship.description }}</p>
          @if (championship.websiteUrl) {
            <a [href]="championship.websiteUrl" 
               target="_blank" 
               rel="noopener noreferrer"
               class="inline-flex items-center gap-2 px-4 sm:px-6 py-2 sm:py-3 bg-accent text-white font-semibold text-xs sm:text-sm uppercase tracking-wide rounded-lg sm:rounded-xl transition-all duration-300 hover:bg-accent-dark hover:-translate-y-1 shadow-lg hover:shadow-xl no-underline">
              Saiba Mais
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
              </svg>
            </a>
          }
        </div>
      </div>
    }
  </section>
</div>
