<div class="min-h-[calc(100vh-200px)] py-20 px-6 bg-bg-dark">
  <section id="carros" class="text-center mb-16 max-w-[800px] mx-auto">
    <h1 class="text-5xl font-bold text-accent mb-4 uppercase tracking-wider">Nossa Frota</h1>
    <p class="text-xl text-text-gray m-0">Honda Civic TypeR preparados para competição</p>
  </section>

  <section class="max-w-[1200px] mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
    @for (car of cars; track car.id) {
      <div class="bg-bg-darker rounded-3xl overflow-hidden border border-border transition-all duration-300 hover:border-accent hover:-translate-y-2 shadow-xl hover:shadow-2xl">
        <div class="w-full h-[320px] overflow-hidden bg-bg-dark">
          <img [src]="car.image" [alt]="car.name" 
               class="w-full h-full object-cover transition-transform duration-500 hover:scale-110" />
        </div>
        <div class="p-8">
          <h3 class="m-0 mb-6 text-accent text-2xl font-bold uppercase tracking-wide">{{ car.name }}</h3>
          <div class="grid grid-cols-2 gap-4 pt-4 border-t border-border">
            <div>
              <p class="text-text-dark text-xs uppercase tracking-wide mb-1">Potência</p>
              <p class="text-white font-semibold text-sm">{{ car.stats.power }}</p>
            </div>
            <div>
              <p class="text-text-dark text-xs uppercase tracking-wide mb-1">Peso</p>
              <p class="text-white font-semibold text-sm">{{ car.stats.weight }}</p>
            </div>
            <div>
              <p class="text-text-dark text-xs uppercase tracking-wide mb-1">Vel. Máx</p>
              <p class="text-white font-semibold text-sm">{{ car.stats.topSpeed }}</p>
            </div>
            <div>
              <p class="text-text-dark text-xs uppercase tracking-wide mb-1">0-100 km/h</p>
              <p class="text-white font-semibold text-sm">{{ car.stats.acceleration }}</p>
            </div>
          </div>
        </div>
      </div>
    }
  </section>
</div>
